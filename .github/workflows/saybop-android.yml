name: SayBop Android build
on:
  push:
    branches: [feat/saybop-android-mvp-20261030]
  pull_request:
    paths:
      - 'SayBop/**'
      - '.github/workflows/saybop-android.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK location
        run: |
          echo "Using preinstalled SDK: $ANDROID_HOME"
      - name: Android SDK 35
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Generate and commit official Gradle wrapper if missing
        working-directory: SayBop
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.9 --distribution-type bin
            chmod +x gradlew
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add gradlew gradlew.bat gradle/wrapper/
            git commit -m "build(saybop): add Gradle 8.9 wrapper including jar"
            git push origin HEAD:feat/saybop-android-mvp-20261030
          fi
      - name: Pure-Java DSP regression
        working-directory: SayBop
        run: bash tests/run.sh
      - name: Android unit tests
        working-directory: SayBop
        run: ./gradlew :app:testDebugUnitTest --stacktrace
      - name: Android lint
        working-directory: SayBop
        run: ./gradlew :app:lintDebug --stacktrace
      - name: Compile actual debug APK
        working-directory: SayBop
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Produce APK, source snapshot and hashes
        run: |
          mkdir -p dist
          cp SayBop/app/build/outputs/apk/debug/app-debug.apk dist/SayBop-v0.1.0-debug.apk
          git archive --format=zip --output=dist/SayBop-v0.1.0-source.zip HEAD SayBop
          (cd dist && sha256sum SayBop-v0.1.0-debug.apk SayBop-v0.1.0-source.zip | tee SHA256SUMS.txt && wc -c *.apk *.zip)
          echo "Source commit: $(git rev-parse HEAD)" >> dist/BUILD.txt
          echo "Build/lint/DSP verified at this commit. Emulator/TTS end-to-end tested separately." >> dist/BUILD.txt
      - name: Publish immutable GitHub preview release (push only)
        if: ${{ github.event_name == 'push' && github.repository == 'BlazeDevStudio/AndroidDevel' }}
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SHA"
          short="${actual:0:12}"
          tag="saybop-preview-$short"
          {
            echo "Experimental SayBop source commit: $actual"
            echo
            echo "Offline text + imported song + beat-synced generated audio and reactive video."
            echo "Contains debug APK, source snapshot, SHA-256 manifest, and build scope."
            echo "Passed in this workflow: pure-Java DSP regression, Android lint, APK compile."
            echo "Android 15 codec/emulator CI runs in a separate workflow; current commit status must be checked separately."
            echo "TTS vocal quality and real-device results remain unverified."
            echo
            echo "This is a preview, not a production release. All content is generated locally."
          } > dist/RELEASE_NOTES.md
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" dist/SayBop-v0.1.0-debug.apk dist/SayBop-v0.1.0-source.zip dist/SHA256SUMS.txt dist/BUILD.txt --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" dist/SayBop-v0.1.0-debug.apk dist/SayBop-v0.1.0-source.zip dist/SHA256SUMS.txt dist/BUILD.txt --prerelease --target "$actual" --title "SayBop Preview $short" --notes-file dist/RELEASE_NOTES.md --repo "$GITHUB_REPOSITORY"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: SayBop-v0.1.0-build
          path: dist/*
          if-no-files-found: error
          retention-days: 30
