name: SayBop Android emulator launch smoke
on:
  push:
    branches: [feat/saybop-android-mvp-20261030]
    paths:
      - 'SayBop/**'
      - '.github/workflows/saybop-emulator.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  emulator-launch:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build installable application
        working-directory: SayBop
        run: ./gradlew :app:assembleDebug
      - name: Enable KVM for emulator
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-saybop-kvm.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          fi
      - name: Launch on Android 15 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_4
          cores: 2
          ram-size: 2048M
          heap-size: 256M
          emulator-boot-timeout: 600
          script: bash .github/scripts/saybop-emulator-smoke.sh
      - name: Test scope
        run: echo "Emulator installation and launch smoke only. Speech synthesis, song import and MP4 export require separate end-to-end evidence."
