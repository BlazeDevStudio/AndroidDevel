name: SayBop Android emulator launch smoke
on:
  push:
    branches: [feat/saybop-android-mvp-20261030]
    paths:
      - 'SayBop/**'
      - '.github/workflows/saybop-emulator.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  emulator-launch:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build installable application
        working-directory: SayBop
        run: ./gradlew :app:assembleDebug
      - name: Launch on Android 15 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_4
          cores: 2
          ram-size: 2048M
          heap-size: 256M
          emulator-boot-timeout: 600
          script: |
            set -euxo pipefail
            adb install -r SayBop/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.saybop.app/.MainActivity
            sleep 5
            adb shell pidof com.saybop.app
            adb shell uiautomator dump /sdcard/saybop-window.xml
            adb shell cat /sdcard/saybop-window.xml | grep -i "SAYBOP"
            cd SayBop && ./gradlew :app:connectedDebugAndroidTest --stacktrace
      - name: Test scope
        run: echo "Emulator installation and launch smoke only. Speech synthesis, song import and MP4 export require separate end-to-end evidence."
